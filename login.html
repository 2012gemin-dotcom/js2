<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daxil Ol və ya Qeydiyyat | ByteCore Premium Web Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #f4f5f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .back-home {
            width: 100%;
            max-width: 440px;
            margin-bottom: 15px;
        }
        .back-home a {
            text-decoration: none;
            color: #312e81;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 24px;
            box-shadow: 0 12px 35px rgba(49, 46, 129, 0.12);
            overflow: hidden;
            border: 1px solid #eee;
        }
        .auth-banner {
            background: linear-gradient(135deg, #312e81, #4D1821);
            color: white;
            padding: 30px 25px;
            text-align: center;
        }
        .auth-banner h2 {
            margin: 0 0 6px 0;
            font-size: 24px;
        }
        .auth-banner p {
            margin: 0;
            font-size: 13px;
            opacity: 0.85;
        }

        /* Giriş / Qeydiyyat Keçid Düymələri (Tabs) */
        .auth-tabs {
            display: flex;
            background: #f3f0ff;
            padding: 6px;
            margin: 20px 25px 0;
            border-radius: 12px;
        }
        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px;
            font-size: 14px;
            font-weight: 700;
            color: #555;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .tab-btn.active {
            background: #312e81;
            color: white;
            box-shadow: 0 4px 10px rgba(49, 46, 129, 0.25);
        }

        .auth-body {
            padding: 25px;
        }
        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
        }
        .input-group {
            margin-bottom: 16px;
            position: relative;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #1e1b4b;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            transition: 0.2s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #312e81;
        }
        .toggle-pass {
            position: absolute;
            right: 14px;
            top: 36px;
            color: #888;
            cursor: pointer;
        }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 20px;
            color: #555;
        }
        .form-options a {
            color: #312e81;
            text-decoration: none;
            font-weight: 600;
        }
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #312e81, #4D1821);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .submit-btn:hover {
            opacity: 0.92;
        }
        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
            font-size: 12px;
            color: #888;
        }
        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 38%;
            height: 1px;
            background: #e2e8f0;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .social-login {
            display: flex;
            gap: 12px;
        }
        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            background: white;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: 0.2s;
        }
        .social-btn:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="back-home">
            <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Ana Səhifəyə Qayıt</a>
        </div>

        <div class="auth-card">
            <div class="auth-banner">
                <h2>ByteCore Kabinet</h2>
                <p>Sifarişlərini izlə və xüsusi bonuslardan yararlan</p>
            </div>

            <!-- Keçid Düymələri -->
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchTab('login', this)">Daxil Ol</button>
                <button class="tab-btn" onclick="switchTab('register', this)">Qeydiyyat</button>
            </div>

            <div class="auth-body">
                <!-- 1. GİRİŞ FORMASI -->
                <form id="login-form" class="form-section active" onsubmit="handleAuth(event, 'Giriş uğurludur!')">
                    <div class="input-group">
                        <label>Mobil nömrə və ya E-poçt</label>
                        <input type="text" placeholder="+994 50 000 00 00" required>
                    </div>
                    <div class="input-group">
                        <label>Şifrə</label>
                        <input type="password" id="login-pass" placeholder="••••••••" required>
                        <i class="fa-regular fa-eye toggle-pass" onclick="togglePassword('login-pass', this)"></i>
                    </div>
                    <div class="form-options">
                        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                            <input type="checkbox"> Məni xatırla
                        </label>
                        <a href="#" onclick="alert('Şifrə yeniləmə kodu nömrənizə göndərildi.')">Şifrəni unutdum?</a>
                    </div>
                    <button type="submit" class="submit-btn">Daxil Ol</button>
                </form>

                <!-- 2. QEYDİYYAT FORMASI -->
                <form id="register-form" class="form-section" onsubmit="handleAuth(event, 'Qeydiyyat tamamlandı! Xoş gəldiniz!')">
                    <div class="input-group">
                        <label>Ad və Soyad</label>
                        <input type="text" placeholder="Məsələn: Murad Əliyev" required>
                    </div>
                    <div class="input-group">
                        <label>Mobil nömrə</label>
                        <input type="tel" placeholder="+994 50 123 45 67" required>
                    </div>
                    <div class="input-group">
                        <label>E-poçt ünvanı</label>
                        <input type="email" placeholder="numune@mail.com" required>
                    </div>
                    <div class="input-group">
                        <label>Yeni Şifrə</label>
                        <input type="password" id="reg-pass" placeholder="Minimum 6 simvol" required>
                        <i class="fa-regular fa-eye toggle-pass" onclick="togglePassword('reg-pass', this)"></i>
                    </div>
                    <button type="submit" class="submit-btn">Hesab Yarat</button>
                </form>

                <div class="divider">və ya</div>

                <!-- Sosial Şəbəkə ilə Giriş -->
                <div class="social-login">
                    <button type="button" class="social-btn" onclick="alert('Google hesabı ilə qoşulur...')">
                        <i class="fa-brands fa-google" style="color: #ea4335;"></i> Google
                    </button>
                    <button type="button" class="social-btn" onclick="alert('Apple ID ilə qoşulur...')">
                        <i class="fa-brands fa-apple" style="font-size: 16px;"></i> Apple
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName, btn) {
            // Düymələrin aktivliyini dəyiş
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Formanı dəyiş
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            document.getElementById(tabName + '-form').classList.add('active');
        }

        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function handleAuth(e, message) {
            e.preventDefault();
            alert(message);
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
